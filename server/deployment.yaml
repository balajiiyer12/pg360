apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg360-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 751835847668.dkr.ecr.us-east-1.amazonaws.com/pg360-backend:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://neondb_owner:npg_ptQwAd7cFEq3@ep-cool-king-b3h7cylt-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
        - name: JWT_SECRET
          value: "secrethaibhai"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080