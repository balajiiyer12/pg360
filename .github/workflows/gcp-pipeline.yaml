name: Deploy GCP Infrastructure and App

on:
  workflow_dispatch:
    inputs:
      region_selection:
        description: 'Region (us, eu, or ap)'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - eu
          - ap
      tier_selection:
        description: 'Machine Tier (small or medium)'
        required: true
        default: 'small'
        type: choice
        options:
          - small
          - medium

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/901253676251/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'b-466-375@pg360-508113.iam.gserviceaccount.com'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init & Apply
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve \
          -var="region_selection=${{ github.event.inputs.region_selection }}" \
          -var="tier_selection=${{ github.event.inputs.tier_selection }}"

    - name: Sync Frontend to Storage Bucket
      run: |
        REGION="${{ github.event.inputs.region_selection }}"
        gsutil rsync -R ./frontend gs://frontend-bucket-${REGION}-v2 || true

    - name: Get GKE Credentials & Deploy App
      run: |
        REGION="${{ github.event.inputs.region_selection }}"
        gcloud container clusters get-credentials gke-primary-${REGION} --region us-central1
        
        kubectl create secret generic app-secrets \
          --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -
        
        kubectl apply -f k8s/deploy.yaml